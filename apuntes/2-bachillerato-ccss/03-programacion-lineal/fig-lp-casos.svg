<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 280" width="570" height="280" font-family="Inter, Helvetica, Arial, sans-serif" role="img"><title>Dos casos especiales: una recta de nivel paralela a un lado de la región, que da infinitas soluciones óptimas, y una región no acotada donde la función objetivo crece sin límite</title><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="1.5" y="1.5" width="567" height="277" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="3"/><text x="145.0" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Óptimo en todo un lado</text><g transform="translate(10,34)"><rect x="1" y="1" width="268" height="228" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="2"/><path d="M27.7,160.1 L187.5,160.1 L164.7,117.1 L27.7,52.7 Z" fill="#FCE678" fill-opacity="0.75" stroke="#1A1A1A" stroke-width="2"/><line x1="14.0" y1="203.1" x2="256.0" y2="203.1" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="27.7" y1="216.0" x2="27.7" y2="14.0" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="164.7" y1="117.1" x2="187.5" y2="160.1" stroke="#F4736C" stroke-width="7" stroke-dasharray="1 0"/><line x1="210.3" y1="203.1" x2="109.9" y2="14.0" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="164.7" cy="117.1" r="5.5" fill="#FCE678" stroke="#1A1A1A" stroke-width="2"/><circle cx="187.5" cy="160.1" r="5.5" fill="#FCE678" stroke="#1A1A1A" stroke-width="2"/><text x="181.7" y="113.1" text-anchor="middle" font-size="15" fill="#1A1A1A" font-weight="700">C</text><text x="204.5" y="166.1" text-anchor="middle" font-size="15" fill="#1A1A1A" font-weight="700">D</text><text x="41.4" y="183.8" text-anchor="start" font-size="12" fill="#1A1A1A" font-weight="700">F = 1600</text></g><text x="425.0" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Región no acotada: sin máximo</text><g transform="translate(290,34)"><rect x="1" y="1" width="268" height="228" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="2"/><path d="M31.3,60.2 L65.9,129.4 L169.6,198.7 L256.0,198.7 L256.0,14.0 L31.3,14.0 Z" fill="#FCE678" fill-opacity="0.75" stroke="#1A1A1A" stroke-width="2"/><line x1="14.0" y1="198.7" x2="256.0" y2="198.7" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="31.3" y1="216.0" x2="31.3" y2="14.0" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="117.7" y1="141.0" x2="188.0" y2="78.4" stroke="#262A3D" stroke-width="3.5" stroke-linecap="round"/><path d="M195.5,71.7 L189.9,83.5 L183.2,75.9 Z" fill="#262A3D"/><text x="135.0" y="77.5" text-anchor="end" font-size="13" fill="#262A3D" font-weight="700">F crece</text><text x="135.0" y="98.3" text-anchor="end" font-size="13" fill="#262A3D" font-weight="700">sin límite</text></g></svg>
