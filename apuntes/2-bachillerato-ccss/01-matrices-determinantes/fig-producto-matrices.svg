weight="700" fill="#1A1A1A">240</text><text x="262" y="72" text-anchor="middle" font-size="18" fill="#1A1A1A">3</text><text x="262" y="98" text-anchor="middle" font-size="18" fill="#1A1A1A">2</text><text x="262" y="124" text-anchor="middle" font-size="18" fill="#1A1A1A">4</text><text x="216" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="#1A1A1A">·</text><text x="312" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="#1A1A1A">=</text><text x="118" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">V (2×3)</text><text x="262" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">p (3×1)</text><text x="372" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">V·p (2×1)</text><text x="280" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">fila 1 de V × columna de p:  40·3 + 25·2 + 10·4 = 210</text></svg>
