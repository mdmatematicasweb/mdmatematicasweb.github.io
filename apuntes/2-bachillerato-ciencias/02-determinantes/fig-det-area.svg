<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Inter, Helvetica, Arial, sans-serif" role="img"><title>El valor absoluto del determinante de dos vectores es el área del paralelogramo que forman</title><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="1.5" y="1.5" width="517" height="317" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="3"/><path d="M92.0,248.0 L332.0,193.0 L412.0,72.0 L172.0,127.0 Z" fill="#F5D65B" stroke="#1A1A1A" stroke-width="2"/><line x1="28.0" y1="248.0" x2="492.0" y2="248.0" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="92.0" y1="292.0" x2="92.0" y2="28.0" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#f)"/><line x1="92.0" y1="248.0" x2="322.3" y2="195.2" stroke="#262A3D" stroke-width="3.5" stroke-linecap="round"/><path d="M332.0,193.0 L321.5,200.6 L319.2,190.7 Z" fill="#262A3D"/><text x="212.0" y="238.5" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#262A3D">u</text><line x1="92.0" y1="248.0" x2="166.5" y2="135.3" stroke="#F4736C" stroke-width="3.5" stroke-linecap="round"/><path d="M172.0,127.0 L169.6,139.8 L161.2,134.2 Z" fill="#F4736C"/><text x="120.0" y="187.5" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#F4736C">v</text><text x="252.0" y="162.8" text-anchor="middle" font-size="15" fill="#1A1A1A" font-weight="700">|det(u, v)| = área</text><text x="252.0" y="180.8" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="700">del paralelogramo</text></svg>
