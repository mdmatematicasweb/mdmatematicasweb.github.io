format:
  html: default
  typst:
    papersize: a4
    margin:
      x: 2.2cm
      top: 2.2cm
      bottom: 3cm
    template-partials:
      - "../typst/page.typ"
    toc: false
    # Los iconos de los callouts usan Font Awesome, que Typst no tiene: salían como «?».
    callout-icon: false
    font-paths:
      - "../fonts"
