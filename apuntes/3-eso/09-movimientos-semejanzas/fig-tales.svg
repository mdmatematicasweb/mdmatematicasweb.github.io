<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" font-family="Inter, Helvetica, Arial, sans-serif" role="img"><title>Teorema de Tales: dos triángulos con lados paralelos tienen lados proporcionales</title><rect x="1.5" y="1.5" width="557" height="307" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="3"/><polygon points="60,250 480,250 300,50" fill="#FCE678" fill-opacity="0.55" stroke="#1A1A1A" stroke-width="3"/><polygon points="60,250 249.0,250 168.0,160.0" fill="#5EC4B6" fill-opacity="0.8" stroke="#1A1A1A" stroke-width="3"/><circle cx="60" cy="250" r="4" fill="#1A1A1A"/><text x="46.0" y="258.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">O</text><circle cx="480" cy="250" r="4" fill="#1A1A1A"/><text x="494.0" y="266.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">A</text><circle cx="300" cy="50" r="4" fill="#1A1A1A"/><text x="300.0" y="38.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">B</text><circle cx="249.0" cy="250" r="4" fill="#1A1A1A"/><text x="249.0" y="272.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">A&#x27;</text><circle cx="168.0" cy="160.0" r="4" fill="#1A1A1A"/><text x="152.0" y="154.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">B&#x27;</text><text x="110.0" y="70.0" text-anchor="start" font-size="16" fill="#F4736C" font-weight="700">A&#x27;B&#x27; ∥ AB</text><text x="280.0" y="298.0" text-anchor="middle" font-size="17" fill="#1A1A1A" font-weight="700">OA&#x27; / OA = OB&#x27; / OB = A&#x27;B&#x27; / AB</text></svg>
