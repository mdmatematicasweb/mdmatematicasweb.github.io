<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350" font-family="Inter, Helvetica, Arial, sans-serif" role="img"><title>Teorema de Pitágoras: los cuadrados de los catetos, 9 y 16, suman el cuadrado de la hipotenusa, 25</title><rect x="1.5" y="1.5" width="517" height="347" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="3"/><rect x="230" y="220" width="96" height="96" fill="#5EC4B6" fill-opacity="0.85" stroke="#1A1A1A" stroke-width="2.5"/><rect x="158" y="148" width="72" height="72" fill="#FCE678" stroke="#1A1A1A" stroke-width="2.5"/><polygon points="326,220 230,148 302,52 398,124" fill="#F4736C" fill-opacity="0.85" stroke="#1A1A1A" stroke-width="2.5"/><polygon points="230,220 326,220 230,148" fill="#EBF8EE" stroke="#1A1A1A" stroke-width="3"/><polyline points="230,208 242,208 242,220" fill="none" stroke="#1A1A1A" stroke-width="2"/><text x="278.0" y="274.0" text-anchor="middle" font-size="18" fill="#1A1A1A" font-weight="700">b² = 16</text><text x="194.0" y="190.0" text-anchor="middle" font-size="18" fill="#1A1A1A" font-weight="700">a² = 9</text><text x="314.0" y="142.0" text-anchor="middle" font-size="18" fill="#1A1A1A" font-weight="700">c² = 25</text><text x="242.0" y="181.6" text-anchor="start" font-size="16" fill="#1A1A1A" font-weight="700">a</text><text x="278.0" y="202.0" text-anchor="middle" font-size="16" fill="#1A1A1A" font-weight="700">b</text><text x="260.0" y="26.0" text-anchor="middle" font-size="18" fill="#1A1A1A" font-weight="700">a² + b² = c²   (9 + 16 = 25)</text></svg>
