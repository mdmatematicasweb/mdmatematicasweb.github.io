<style>
#md-cookies{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:99990;max-width:560px;margin:0 auto;padding:1rem 1.1rem;background:#FCE678;color:#000;border:3px solid #000;box-shadow:6px 6px 0 #000;font:500 .92rem/1.45 "Bricolage Grotesque",system-ui,sans-serif}
#md-cookies p{margin:0 0 .7rem}
#md-cookies a{color:#000;font-weight:700;text-decoration:underline}
#md-cookies .mc-btns{display:flex;gap:.6rem;flex-wrap:wrap}
#md-cookies button{font:800 .85rem/1 "Bricolage Grotesque",system-ui,sans-serif;text-transform:uppercase;padding:.6rem 1rem;border:3px solid #000;cursor:pointer;color:#000;box-shadow:3px 3px 0 #000}
#md-cookies button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
#md-cookies .mc-ok{background:#5EC4B6}
#md-cookies .mc-no{background:#fff}
</style>
<script>
(function () {
  var ID = "G-3KNXHFYZ70"; // ID de medición de Google Analytics 4
  var KEY = "md-cookies";
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

  function load() {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", ID, { anonymize_ip: true });
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + ID;
    document.head.appendChild(s);
  }

  function clearGA() {
    var host = location.hostname.split(".");
    var doms = ["", "." + host.slice(-2).join("."), "." + location.hostname];
    document.cookie.split(";").forEach(function (c) {
      var n = c.split("=")[0].trim();
      if (/^_ga/.test(n)) doms.forEach(function (d) {
        document.cookie = n + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/" + (d ? ";domain=" + d : "");
      });
    });
  }

  function banner() {
    if (document.getElementById("md-cookies")) return;
    var b = document.createElement("div");
    b.id = "md-cookies";
    b.setAttribute("role", "dialog");
    b.setAttribute("aria-label", "Aviso de cookies");
    b.innerHTML =
      "<p>Uso cookies de <strong>Google Analytics</strong> solo para contar visitas de forma anónima. " +
      "No se activan si las rechazas. Más información en la " +
      '<a href="/licencia.html#cookies">política de cookies</a>.</p>' +
      '<div class="mc-btns"><button class="mc-ok" type="button">Aceptar</button>' +
      '<button class="mc-no" type="button">Rechazar</button></div>';
    b.querySelector(".mc-ok").onclick = function () { set("si"); b.remove(); load(); };
    b.querySelector(".mc-no").onclick = function () { set("no"); b.remove(); clearGA(); };
    document.body.appendChild(b);
  }

  window.mdCookies = function () { set(""); banner(); };
  var v = get();
  if (v === "si") load();
  else if (v !== "no") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", banner);
    else banner();
  }
})();
</script>
