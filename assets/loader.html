<style>
#md-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;background:#262A3D;color:#FBF2D6;font-family:"Bricolage Grotesque",system-ui,sans-serif;transition:opacity .35s ease,visibility .35s}
#md-loader.md-out{opacity:0;visibility:hidden}
#md-loader .ml-logo{width:96px;height:96px;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border:5px solid #000;background:#000;box-shadow:8px 8px 0 #000;animation:ml-tilt 2.4s ease-in-out infinite}
#md-loader .ml-logo i{display:grid;place-items:center;font:900 28px/1 "Arial Black",Arial,sans-serif;font-style:normal;color:#000;animation:ml-pop 1.6s ease-in-out infinite}
#md-loader .ml-logo i:nth-child(1){background:#5EC4B6}
#md-loader .ml-logo i:nth-child(2){background:#262A3D;color:#F5D65B;animation-delay:.2s}
#md-loader .ml-logo i:nth-child(3){background:#F4736C;animation-delay:.6s}
#md-loader .ml-logo i:nth-child(4){background:#F5D65B;animation-delay:.4s}
#md-loader .ml-txt{font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em;text-align:center;padding:0 1rem}
#md-loader .ml-txt b{color:#F5D65B}
#md-loader .ml-bar{width:min(260px,70vw);height:14px;border:3px solid #000;background:#000;box-shadow:4px 4px 0 #000;overflow:hidden}
#md-loader .ml-bar::after{content:"";display:block;height:100%;width:40%;background:repeating-linear-gradient(-45deg,#5EC4B6 0 10px,#F4736C 10px 20px,#F5D65B 20px 30px);animation:ml-slide 1.1s ease-in-out infinite}
@keyframes ml-pop{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes ml-tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes ml-slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#md-loader *{animation:none!important}}
</style>
<noscript><style>#md-loader{display:none!important}</style></noscript>
<script>
(function () {
  try {
    var el = document.createElement("div");
    el.id = "md-loader";
    el.setAttribute("role", "status");
    el.innerHTML =
      '<div class="ml-logo" aria-hidden="true"><i>+</i><i>&minus;</i><i>&times;</i><i>=</i></div>' +
      '<div class="ml-txt">Mientras carga&hellip; <b>un descanso</b></div>' +
      '<div class="ml-bar" aria-hidden="true"></div>';
    document.documentElement.appendChild(el);
    var t0 = Date.now(), gone = false;
    var hide = function () {
      if (gone) return;
      gone = true;
      var wait = Math.max(0, 1000 - (Date.now() - t0));
      setTimeout(function () {
        el.classList.add("md-out");
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
      }, wait);
    };
    var ready = function () {
      var m = window.MathJax;
      if (m && m.startup && m.startup.promise && m.startup.promise.then) {
        m.startup.promise.then(hide, hide);
      } else { hide(); }
    };
    if (document.readyState === "complete") ready();
    else window.addEventListener("load", ready);
    window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
    setTimeout(hide, 10000);
  } catch (e) {}
})();
</script>
