lang: es

brand:
  light: _brand.yml
  dark: _brand-dark.yml

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "apuntes/**/*.qmd"
    - "ejercicios/**/*.qmd"
    - "actividades/**/*.qmd"
    - "!**/fuentes/**"
    - "!**/3-eso/**"   # 3º ESO: oculto de momento (los ficheros se conservan)
  resources:
    - "assets/**"

website:
  title: "MD Matemáticas"
  description: "Apuntes, ejercicios y actividades interactivas de matemáticas"
  site-url: "https://mdmatematicasweb.github.io"
  favicon: logo-mark.svg
  navbar:
    logo: logo-mark.svg
    left:
      - href: index.qmd
        text: Inicio
      - href: apuntes/index.qmd
        text: Apuntes
      - href: ejercicios/index.qmd
        text: Ejercicios
      - href: actividades/index.qmd
        text: Actividades
      - href: actividades/2-bachillerato-ciencias/examen/index.qmd
        text: "★ Simulacro PAU"
  sidebar:
    - id: apuntes
      title: "Apuntes"
      contents:
        - section: "2º Bachillerato Ciencias"
          contents:
            - "apuntes/2-bachillerato-ciencias/**/*.qmd"
            - "!apuntes/2-bachillerato-ciencias/**/fuentes/**"
    - id: ejercicios
      title: "Ejercicios"
      contents:
        - section: "2º Bachillerato Ciencias"
          contents:
            - "ejercicios/2-bachillerato-ciencias/**/*.qmd"
            - "!ejercicios/2-bachillerato-ciencias/**/fuentes/**"
    - id: actividades
      title: "Actividades"
      contents:
        - section: "2º Bachillerato Ciencias"
          contents:
            - "actividades/2-bachillerato-ciencias/**/*.qmd"
            - "!actividades/2-bachillerato-ciencias/**/fuentes/**"
  page-footer:
    center: "© 2026 MD Matemáticas · contenidos [CC BY-NC-ND 4.0](/licencia.qmd) · código y diseño: todos los derechos reservados"

format:
  html:
    theme:
      light: [cosmo, brand]
      dark: [cosmo, brand]
    css: styles.css
    include-in-header: assets/loader.html
    toc: true
    code-copy: true
    smooth-scroll: true

execute:
  freeze: auto
