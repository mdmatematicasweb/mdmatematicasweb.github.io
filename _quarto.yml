lang: es

brand:
  light: _brand.yml
  dark: _brand-dark.yml

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "apuntes/**/*.qmd"
    - "ejercicios/**/*.qmd"
    - "actividades/**/*.qmd"
    - "!**/fuentes/**"
  resources:
    - "assets/**"
    - CNAME

website:
  title: "MD Matemáticas"
  description: "Apuntes, ejercicios y actividades interactivas de matemáticas"
  site-url: "https://mdmatematicas.es"
  favicon: logo-mark.svg
  navbar:
    logo: logo-mark.svg
    left:
      - href: index.qmd
        text: Inicio
      - href: apuntes/index.qmd
        text: Apuntes
      - href: ejercicios/index.qmd
        text: Ejercicios
      - href: actividades/index.qmd
        text: Actividades
      - text: "★ Simulacros"
        menu:
          - href: actividades/3-eso/prueba-competencial/index.qmd
            text: "3º ESO (prueba competencial)"
          - href: actividades/2-bachillerato-ciencias/examen/index.qmd
            text: "Ciencias (Matemáticas II)"
          - href: actividades/2-bachillerato-ccss/examen/index.qmd
            text: "Ciencias Sociales (Mat. Aplicadas II)"
  sidebar:
    - id: apuntes
      title: "Apuntes"
      contents:
        - section: "3º ESO"
          contents:
            - "apuntes/3-eso/**/*.qmd"
            - "!apuntes/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "apuntes/2-bachillerato-ciencias/**/*.qmd"
            - "!apuntes/2-bachillerato-ciencias/**/fuentes/**"
        - section: "2º Bachillerato Ciencias Sociales"
          contents:
            - "apuntes/2-bachillerato-ccss/**/*.qmd"
            - "!apuntes/2-bachillerato-ccss/**/fuentes/**"
    - id: ejercicios
      title: "Ejercicios"
      contents:
        - section: "3º ESO"
          contents:
            - "ejercicios/3-eso/**/*.qmd"
            - "!ejercicios/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "ejercicios/2-bachillerato-ciencias/**/*.qmd"
            - "!ejercicios/2-bachillerato-ciencias/**/fuentes/**"
        - section: "2º Bachillerato Ciencias Sociales"
          contents:
            - "ejercicios/2-bachillerato-ccss/**/*.qmd"
            - "!ejercicios/2-bachillerato-ccss/**/fuentes/**"
    - id: actividades
      title: "Actividades"
      contents:
        - section: "3º ESO"
          contents:
            - "actividades/3-eso/**/*.qmd"
            - "!actividades/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "actividades/2-bachillerato-ciencias/**/*.qmd"
            - "!actividades/2-bachillerato-ciencias/**/fuentes/**"
        - section: "2º Bachillerato Ciencias Sociales"
          contents:
            - "actividades/2-bachillerato-ccss/**/*.qmd"
            - "!actividades/2-bachillerato-ccss/**/fuentes/**"
  page-footer:
    center: "© 2026 MD Matemáticas · contenidos [CC BY-NC-ND 4.0](/licencia.qmd) · código y diseño: todos los derechos reservados"

format:
  html:
    theme:
      light: [cosmo, brand]
      dark: [cosmo, brand]
    css: styles.css
    include-in-header:
      - assets/loader.html
      - assets/analytics.html
    toc: true
    code-copy: true
    smooth-scroll: true

execute:
  freeze: auto
