project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "apuntes/**/*.qmd"
    - "ejercicios/**/*.qmd"
    - "actividades/**/*.qmd"
    - "!**/fuentes/**"

website:
  title: "MD Matemáticas"
  description: "Apuntes, ejercicios y actividades interactivas de matemáticas"
  site-url: "https://mdmatematicasweb.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: apuntes/index.qmd
        text: Apuntes
      - href: ejercicios/index.qmd
        text: Ejercicios
      - href: actividades/index.qmd
        text: Actividades
    right:
      - icon: github
        href: https://github.com/mdmatematicasweb/mdmatematicasweb.github.io
  sidebar:
    - id: apuntes
      title: "Apuntes"
      contents:
        - section: "3º ESO"
          contents:
            - "apuntes/3-eso/**/*.qmd"
            - "!apuntes/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "apuntes/2-bachillerato-ciencias/**/*.qmd"
            - "!apuntes/2-bachillerato-ciencias/**/fuentes/**"
    - id: ejercicios
      title: "Ejercicios"
      contents:
        - section: "3º ESO"
          contents:
            - "ejercicios/3-eso/**/*.qmd"
            - "!ejercicios/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "ejercicios/2-bachillerato-ciencias/**/*.qmd"
            - "!ejercicios/2-bachillerato-ciencias/**/fuentes/**"
    - id: actividades
      title: "Actividades"
      contents:
        - section: "3º ESO"
          contents:
            - "actividades/3-eso/**/*.qmd"
            - "!actividades/3-eso/**/fuentes/**"
        - section: "2º Bachillerato Ciencias"
          contents:
            - "actividades/2-bachillerato-ciencias/**/*.qmd"
            - "!actividades/2-bachillerato-ciencias/**/fuentes/**"
  page-footer:
    center: "MD Matemáticas · construido con Quarto"

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    code-copy: true
    smooth-scroll: true

execute:
  freeze: auto
