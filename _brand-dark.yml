meta:
  name: "MD Matemáticas (oscuro)"

color:
  palette:
    navy: "#2c142c"
    mint: "#5EC4B6"
    coral: "#F4736C"
    yellow: "#FCE678"
    ink: "#eceff4"
    night: "#141b26"
    orchid: "#d163cc"
    sky: "#4fb3e8"
  foreground: ink
  background: night
  primary: orchid
  secondary: coral
  success: mint
  warning: coral
  link: sky

typography:
  fonts:
    - family: "Bricolage Grotesque"
      source: google
      weight: [500, 600, 700, 800]
